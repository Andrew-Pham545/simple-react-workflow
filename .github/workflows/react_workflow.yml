name: react_workflow
on: 
  workflow_dispatch:
  push:
jobs:
  runs-on: ubuntu-22.04
  steps:
    - name: getting code
      uses: actions/checkout@v3
    - name: install NodeJS
      uses: actions/setup-node@v3
      with: 
        node-version: 18 
    - name: install dependencies
      run: npm ci
    - name: running test
      run: npm test


